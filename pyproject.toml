[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tts-pipeline"
version = "0.1.0"
description = "Production-grade MLOps pipeline for lightweight Text-to-Speech"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.2",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "pydantic>=2.7.0",
    "mlflow>=2.13.0",
    "dvc>=3.50.0",
    "prefect>=2.19.0",
    "phonemizer>=3.3.0",
    "unidecode>=1.3.8",
    "inflect>=7.3.0",
]

[project.optional-dependencies]
train = [
    "lightning>=2.3.0",
    "torchcrepe>=0.0.23",
    "pesq>=0.0.4",
    "pystoi>=0.4.1",
    "openai-whisper>=20231117",
    "jiwer>=3.0.4",
    "speechmos>=1.2.1",
]
serve = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "onnxruntime>=1.18.0",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "ruff>=0.4.7",
    "black>=24.4.2",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
    "papermill>=2.6.0",
]

[project.scripts]
tts-data = "tts_pipeline.data.ingestion:cli"
tts-train = "tts_pipeline.training.trainer:cli"
tts-eval = "tts_pipeline.evaluation.reporter:cli"
tts-serve = "tts_pipeline.serving.app:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# ── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "pipelines"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "N812"]

[tool.ruff.lint.isort]
known-first-party = ["tts_pipeline"]

# ── Black ────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["notebooks/", "artifacts/", "data/"]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (use -m 'not slow' to skip)",
    "gpu: marks tests requiring GPU",
]
asyncio_mode = "auto"
